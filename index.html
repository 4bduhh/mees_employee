    function login(){$('#app').innerHTML=`<div class="lg"><img class="logo" src="${LOGO}" alt="Meess"><h2 style="font-size:24px">Staff app</h2><p class="mu" style="margin-bottom:16px">Sign in with the email and password from your admin.</p><div class="c" style="text-align:left"><input id="e" type="email" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button class="b p" onclick="run(auth)">Sign in</button></div><p class="mu">No login yet? Ask the office admin to create one.</p></div>`;

async function auth(){const email=$('#e').value.trim(),password=$('#p').value;if(!email||!password)throw Error('Enter your email and password.');
 const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;await start()}
async function start(){const{data:{session}}=await db.auth.getSession();if(!session)return login();me=session.user;
     let s=(await db.from('staff').select('*').eq('user_id',me.id).maybeSingle()).data;
     if(!s)s=(await db.from('staff').insert({user_id:me.id,name:(me.user_metadata||{}).name||me.email}).select().single()).data;
     me.name=(s&&s.name)||me.email;me.erp=s&&s.erp_emp;await load()}
    async function load(){const d=day(),[c,a,v]=await Promise.all([db.from('config').select('*').eq('id',1).single(),db.from('attendance').select('*').eq('user_id',me.id).eq('day',d).maybeSingle(),db.from('visits').select('*').eq('user_id',me.id).eq('day',d).order('id')]);
     cfg=c.data||{};att=a.data;vis=v.data||[];home()}
    
    const el=(a,b)=>{const m=Math.max(0,Math.floor((b-a)/6e4));return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'},
 clock=()=>new Date().toLocaleTimeString('en-US',{timeZone:'Asia/Muscat',hour:'2-digit',minute:'2-digit',second:'2-digit'});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clock();const w=$('#wk');if(w&&att&&att.in_at&&!att.out_at)w.textContent=el(Date.parse(att.in_at),Date.now());const o=vis.find(v=>!v.ret_at),t=$('#vt');if(t&&o)t.textContent=el(Date.parse(o.left_at),Date.now())},1000);
function home(){if(tab=='hist')return hist();const open=vis.find(v=>!v.ret_at),out=att&&att.out_at,done=vis.filter(v=>v.ret_at),h=+new Date().toLocaleString('en-US',{timeZone:'Asia/Muscat',hour:'numeric',hour12:false}),

 ${sx=='done'?'<div class="dn">✓</div><p class="hint" style="margin:0">Thanks for today. See you tomorrow!</p>':''}
 ${sx=='visit'?'<p class="hint" style="margin-top:18px">Finish your visit below to check out.</p>':''}</div>
 ${me.erp?'':'<div class="c" style="border-color:var(--wa)"><b>Login not linked yet</b><p class="mu" style="margin:4px 0 0">Tell your admin to link your login to your employee record, otherwise attendance will not count for salary.</p></div>'}
 ${att?`<div class="stats"><div class="s"><small>Checked in</small><b>${tm(att.in_at)}</b></div><div class="s"><small>Checked out</small><b>${tm(att.out_at)}</b></div><div class="s"><small>Time worked</small><b id="wk">${att.in_at?el(Date.parse(att.in_at),att.out_at?Date.parse(att.out_at):Date.now()):'—'}</b></div></div>`:''}
 ${att&&!out&&!open?'<button class="b" onclick="outForm()">🚗 Going out for a visit</button>':''}
 ${open?visitCard(open):''}<div id="of"></div>
 ${done.length?`<div class="c"><h3>Today's visits (${done.length})</h3>${done.map(v=>`<div class="tl"><i class="${v.match?'ok':'er'}">${v.match?'✅':'⚠️'}</i><div><b>${E(v.dest_text)}</b><span class="mu">${tm(v.left_at)} to ${tm(v.ret_at)} · ${el(Date.parse(v.left_at),Date.parse(v.ret_at))}</span></div><span class="t ${v.match?'ok':'er'}">${v.match?'Matched':'Mismatch'}</span>${v.photo?`<button class="ib" style="width:38px;height:38px" onclick="run(()=>viewPhoto('${E(v.photo)}'))" aria-label="View photo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 8h2.6l1.4-2h7l1.4 2h2.6a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.3"/></svg></button>`:''}</div>`).join('')}</div>`:''}${nav()}`}

const visitCard=v=>`<div class="c"><div class="vh"><span class="dot"></span><b>On a visit</b><span class="mu" id="vt">${el(Date.parse(v.left_at),Date.now())}</span></div><h3 style="margin:10px 0 2px;font-size:20px">${E(v.dest_text)}</h3><div class="mu">Left at ${tm(v.left_at)}</div>${v.arr_at
 ?`<p><span class="t ${v.match?'ok':'er'}">${v.match?'Location matched':'Location mismatch'} · ${v.arr_dist} m</span></p><button class="b p" onclick="run(()=>finish(${v.id}))">Finish visit</button>`
 :`<button class="b p" onclick="run(()=>arrive(${v.id}))">📷 I have arrived · take live photo</button><p class="mu">Opens the live camera. The photo is stamped with time and location. Gallery photos are not allowed.</p>`}</div>`;

function outForm(){$('#of').innerHTML=`<div class="c"><h3>Where are you going?</h3><input id="dt" placeholder="Place / customer name"><div id="rp"></div><div class="srch"><span class="si"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span><input id="sq" type="search" placeholder="Search a place on the map…" autocomplete="off" enterkeyhint="search" aria-label="Search place"><button class="sx" id="sx" type="button" hidden aria-label="Clear search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div id="sr" class="sr" hidden></div></div><div class="mu">Search above or tap the map to pin the place</div><div id="map"></div><button class="b" onclick="run(useMe)">Use my current location</button><button class="b p" onclick="run(goOut)">Start visit</button></div>`;
     pin=null;pm=null;if(map){map.remove();map=null}map=L.map('map').setView([cfg.lat||23.588,cfg.lng||58.383],14);
     const gl=L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=en&x={x}&y={y}&z={z}',{subdomains:'0123',maxZoom:20,attribution:'Map data © Google'}).addTo(map);
     gl.once('tileerror',()=>{map.removeLayer(gl);L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap © CARTO'}).addTo(map)});
     map.on('click',e=>setPin(e.latlng.lat,e.latlng.lng));$('#of').scrollIntoView();recentPlaces();placeSearch()}
    const setPin=(a,b)=>{pin={lat:a,lng:b};pm?pm.setLatLng([a,b]):(pm=L.marker([a,b],{icon:L.divIcon({className:'pinw',html:'<div class="pinx"></div>',iconSize:[30,34],iconAnchor:[15,32]})}).addTo(map))};
    /* ---- place search (OpenStreetMap Nominatim) */
    let _st=null,_sq=0;
    function placeSearch(){const q=$('#sq'),r=$('#sr'),x=$('#sx');if(!q)return;
     const run1=(v,go)=>{r.hidden=false;r.innerHTML='<div class="sm">Searching…</div>';doSearch(v,go)};
     q.oninput=()=>{x.hidden=!q.value;clearTimeout(_st);const v=q.value.trim();if(v.length<3){r.hidden=true;return}_st=setTimeout(()=>run1(v),500)};
     q.onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();clearTimeout(_st);const v=q.value.trim();if(v.length>=2)run1(v,true)}};
     q.onfocus=()=>{if(window._sr&&window._sr.length&&q.value.trim().length>=3)r.hidden=false};
     x.onclick=()=>{q.value='';x.hidden=true;r.hidden=true;q.focus()}}
    async function doSearch(v,go){const id=++_sq,r=$('#sr');if(!r)return;
     try{const la=cfg.lat||23.588,ln=cfg.lng||58.383,vb=[ln-1.5,la+1.5,ln+1.5,la-1.5].join(','),ac=new AbortController(),tt=setTimeout(()=>ac.abort(),10000);
      const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=en&viewbox='+vb+'&q='+encodeURIComponent(v),{signal:ac.signal,headers:{Accept:'application/json'}});clearTimeout(tt);
      if(!res.ok)throw Error('x');const d=await res.json();if(id!=_sq||!$('#sr'))return;window._sr=d;
      if(!d.length){r.innerHTML='<div class="sm">No places found. Try another name or tap the map.</div>';return}
      if(go){pickPlace(0);return}
      r.innerHTML=d.map((x,i)=>{const n=x.name||String(x.display_name).split(',')[0],sub=String(x.display_name).split(',').slice(1,4).join(',').trim();return`<button type="button" onclick="pickPlace(${i})"><span class="pi"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg></span><span class="pt"><b>${E(n)}</b><small>${E(sub)}</small></span></button>`}).join('')}
     catch(e){if(id==_sq&&$('#sr'))r.innerHTML='<div class="sm">Search is unavailable right now. Tap the map to pin the place.</div>'}}
    function pickPlace(i){const x=(window._sr||[])[i];if(!x)return;const a=+x.lat,b=+x.lon,n=x.name||String(x.display_name).split(',')[0];
     setPin(a,b);map.setView([a,b],17);if(!$('#dt').value.trim())$('#dt').value=n;$('#sq').value=n;$('#sx').hidden=false;$('#sr').hidden=true;toast('Pinned: '+n)}
    document.addEventListener('click',e=>{const r=$('#sr');if(r&&!e.target.closest('.srch'))r.hidden=true});
    async function useMe(){const p=await gps();setPin(p.lat,p.lng);map.setView([p.lat,p.lng],16)}
    
    async function checkIn(){if(cfg.lat==null)throw Error('Office location is not set yet. Ask the admin.');
     const p=await gps(),d=Math.round(hav(cfg.lat,cfg.lng,p.lat,p.lng));
     if(d>cfg.r)throw Error(`You are ${d} m from the office. Allowed: ${cfg.r} m.`);
     const r=await db.from('attendance').insert({user_id:me.id,in_lat:p.lat,in_lng:p.lng,in_dist:d});if(r.error)throw r.error;toast('Checked in ✓');await load()}
    function gps2(){return gps().catch(()=>new Promise((ok,no)=>navigator.geolocation?navigator.geolocation.getCurrentPosition(q=>ok({lat:q.coords.latitude,lng:q.coords.longitude}),()=>no(Error('Turn on location and allow it for this page.')),{enableHighAccuracy:false,timeout:15000,maximumAge:120000}):no(Error('This phone has no GPS.'))))}
    /* check-out only records where the employee is; there is no office-distance check */
    async function checkOut(){if(!confirm('Check out now? You worked '+el(Date.parse(att.in_at),Date.now())+' today.'))return;const p=await gps2(),r=await db.from('attendance').update({out_lat:p.lat,out_lng:p.lng}).eq('id',att.id);if(r.error)throw r.error;toast('Checked out ✓');await load()}
    async function goOut(){const t=$('#dt').value.trim();if(!t)throw Error('Enter where you are going.');if(!pin)throw Error('Tap the map to pin the place.');
     const r=await db.from('visits').insert({user_id:me.id,dest_text:t,dest_lat:pin.lat,dest_lng:pin.lng});if(r.error)throw r.error;await load()}
    async function shrink(f){const b=await createImageBitmap(f),k=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.7))}
    async function arrive(id){const v=vis.find(x=>x.id==id),sn=await livePhoto('Visit: '+v.dest_text),p=sn.pos,d=Math.round(hav(v.dest_lat,v.dest_lng,p.lat,p.lng)),path=`${me.id}/${id}-${Date.now()}.jpg`;
     toast('Uploading photo…');const up=await db.storage.from('visit-photos').upload(path,sn.blob,{contentType:'image/jpeg'});if(up.error)throw up.error;
     const r=await db.from('visits').update({arr_lat:p.lat,arr_lng:p.lng,arr_dist:d,match:d<=VR,photo:path}).eq('id',id);if(r.error)throw r.error;
     toast(d<=VR?'Photo saved · location matched ✓':`Photo saved · warning: ${d} m from the place you gave`);await load()}
    async function finish(id){const r=await db.from('visits').update({ret_at:new Date().toISOString()}).eq('id',id);if(r.error)throw r.error;await load()}
    

    /* ===== v2: live camera (no gallery), stamped photos, recent places, My days ===== */
    let tab='home';
    const nav=()=>`<nav class="nv"><button class="${tab=='home'?'on':''}" onclick="setTab('home')" aria-label="Today"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.8 12 3.5l8.5 7.3"/><path d="M5.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h10a1.5 1.5 0 0 0 1.5-1.5V9.5"/><path d="M9.8 20.5v-5.2a1 1 0 0 1 1-1h2.4a1 1 0 0 1 1 1v5.2"/></svg><span>Today</span></button><button class="${tab=='hist'?'on':''}" onclick="setTab('hist')" aria-label="My days"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9.2 15.2 2 2 3.8-3.9"/></svg><span>My days</span></button></nav>`,
    setTab=t=>run(async()=>{tab=t;t=='hist'?await hist():await load()});
    function livePhoto(label){return new Promise((res,rej)=>{
     if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!navigator.geolocation)return rej(Error('Live camera needs the secure (https) link of the app and a phone with camera and GPS.'));
     let stream,wid,pos=null,face='environment',shot=null;
     const o=document.createElement('div');o.className='cam';
     o.innerHTML='<video playsinline muted autoplay></video><img class="pv" hidden alt="Captured photo"><div class="cs">📍 Getting location…</div><div class="cb"><button class="b cx">Cancel</button><button class="shot" disabled aria-label="Take photo"></button><button class="b sw">⟲ Flip</button></div><div class="cb2" hidden><button class="b rt">Retake</button><button class="b p us">Use photo</button></div>';
     document.body.appendChild(o);
     const v=o.querySelector('video'),pv=o.querySelector('.pv'),cs=o.querySelector('.cs'),sh=o.querySelector('.shot'),cb=o.querySelector('.cb'),cb2=o.querySelector('.cb2');
     const stop=()=>{stream&&stream.getTracks().forEach(t=>t.stop());wid!=null&&navigator.geolocation.clearWatch(wid);o.remove()},
     open=async()=>{try{stream&&stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face},width:{ideal:1280}},audio:false});v.srcObject=stream;await v.play().catch(()=>{})}catch(e){stop();rej(Error('Camera is blocked. Allow camera access for this page, then try again.'))}};
     wid=navigator.geolocation.watchPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy)};cs.textContent='📍 Location ready · ±'+pos.acc+' m';sh.disabled=false},()=>{cs.textContent='⚠️ Turn on location and allow it to take the photo'},{enableHighAccuracy:true,maximumAge:0,timeout:30000});
     sh.onclick=()=>{if(!pos||!v.videoWidth)return;const k=Math.min(1,1024/Math.max(v.videoWidth,v.videoHeight)),w=Math.round(v.videoWidth*k),h=Math.round(v.videoHeight*k),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(v,0,0,w,h);
      const ts=new Date().toLocaleString('en-GB',{timeZone:'Asia/Muscat',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}),L=[label+' · '+(me.name||''),ts+' (Muscat)','GPS '+pos.lat.toFixed(5)+', '+pos.lng.toFixed(5)+' ±'+pos.acc+' m'],fs=Math.max(13,Math.round(w/34)),bh=fs*L.length*1.35+fs,snap={...pos};
      x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,h-bh,w,bh);x.fillStyle='#fff';x.font='600 '+fs+'px sans-serif';L.forEach((t,i)=>x.fillText(t,fs*.6,h-bh+fs*1.3*(i+1)));
      c.toBlob(b=>{shot={blob:b,pos:snap};pv.src=URL.createObjectURL(b);pv.hidden=false;v.hidden=true;cb.hidden=true;cb2.hidden=false;cs.textContent='Check that the photo is clear'},'image/jpeg',.78)};
     o.querySelector('.rt').onclick=()=>{shot=null;pv.hidden=true;v.hidden=false;cb.hidden=false;cb2.hidden=true;cs.textContent=pos?'📍 Location ready · ±'+pos.acc+' m':'📍 Getting location…'};
     o.querySelector('.us').onclick=()=>{const r=shot;stop();res(r)};
     o.querySelector('.cx').onclick=()=>{stop();rej(Error('Photo cancelled'))};
     o.querySelector('.sw').onclick=()=>{face=face=='environment'?'user':'environment';open()};
     open()})}
    async function viewPhoto(p){const r=await db.storage.from('visit-photos').createSignedUrl(p,300),u=(r.data&&r.data.signedUrl)||db.storage.from('visit-photos').getPublicUrl(p).data.publicUrl,
     o=document.createElement('div');o.className='cam';o.innerHTML='<img class="pv" alt="Visit photo" src="'+u+'"><div class="cb"><button class="b cx">Close</button></div>';document.body.appendChild(o);o.querySelector('.cx').onclick=()=>o.remove()}
    async function recentPlaces(){const r=await db.from('visits').select('dest_text,dest_lat,dest_lng').eq('user_id',me.id).order('id',{ascending:false}).limit(40),m=new Map();(r.data||[]).forEach(x=>{const k=(x.dest_text||'').trim().toLowerCase();k&&!m.has(k)&&m.set(k,x)});
     const L=[...m.values()].slice(0,6),b=$('#rp');if(!b||!L.length)return;window._rp=L;b.innerHTML='<div class="mu" style="margin-top:4px">Recent places · tap to reuse</div>'+L.map((x,i)=>`<button class="pl2" onclick="usePlace(${i})">${E(x.dest_text)}</button>`).join('')}
    const usePlace=i=>{const x=window._rp[i];$('#dt').value=x.dest_text;setPin(x.dest_lat,x.dest_lng);map.setView([x.dest_lat,x.dest_lng],16)};
    async function hist(){tab='hist';$('#app').innerHTML=`<div class="top"><img class="logo" src="${LOGO}" alt="Meess"><span class="sp"></span><button class="ib" onclick="setTab('home')" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><h2>My days</h2><p class="mu">Last 14 days · hours worked and what your manager verified</p><div id="hb" class="mu">Loading…</div>${nav()}`;
     const from=new Date(Date.now()-14*864e5).toLocaleDateString('en-CA',{timeZone:'Asia/Muscat'}),q=c=>db.from('attendance').select(c).eq('user_id',me.id).gte('day',from).order('day',{ascending:false});
     let a=await q('day,in_at,out_at,status');if(a.error)a=await q('day,in_at,out_at');const v=await db.from('visits').select('day,id').eq('user_id',me.id).gte('day',from);if(a.error)throw a.error;
     const R=a.data||[],mins=R.reduce((t,r)=>t+(r.in_at?Math.max(0,((r.out_at?Date.parse(r.out_at):Date.now())-Date.parse(r.in_at))/6e4):0),0),vc=(v.data||[]).length,vd={};(v.data||[]).forEach(x=>vd[x.day]=(vd[x.day]||0)+1);
     const sc=r=>r.status=='Present'?'ok':r.status=='Absent'?'er':'wa',dl=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
     $('#hb').outerHTML=`<div class="stats"><div class="s"><small>Days worked</small><b>${R.length}</b></div><div class="s"><small>Total hours</small><b>${Math.floor(mins/60)}h ${String(Math.round(mins%60)).padStart(2,'0')}m</b></div><div class="s"><small>Visits</small><b>${vc}</b></div></div>
     <div class="c">${R.length?R.map(r=>`<div class="tl"><i class="${r.out_at?'ok':'er'}">${r.out_at?'✅':'⏳'}</i><div><b>${dl(r.day)}</b><span class="mu">${tm(r.in_at)} – ${r.out_at?tm(r.out_at):'not checked out'} · ${r.in_at?el(Date.parse(r.in_at),r.out_at?Date.parse(r.out_at):Date.now()):'—'}${vd[r.day]?' · '+vd[r.day]+' visit'+(vd[r.day]>1?'s':''):''}</span></div><span class="t ${sc(r)}">${r.status||'Waiting'}</span></div>`).join(''):'<p class="mu" style="margin:0">No attendance yet. Check in from the Today tab.</p>'}</div>`}
    /* soft 3D tilt on glass cards (mouse / pen only) */
    {const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;if(fine){let cur=null;
     document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.hero,.c,.s');if(cur&&cur!==c){cur.style.transform='';cur=null}if(!c||e.target.closest('#map,input,.sr'))return;cur=c;const b=c.getBoundingClientRect(),x=(e.clientX-b.left)/b.width-.5,y=(e.clientY-b.top)/b.height-.5;c.style.transform='perspective(900px) rotateX('+(-y*5).toFixed(2)+'deg) rotateY('+(x*6).toFixed(2)+'deg) translateZ(0)'});
     document.addEventListener('pointerleave',()=>{cur&&(cur.style.transform='',cur=null)},true)}}
    {db=supabase.createClient(SB_URL,SB_KEY);start().catch(e=>{login();toast(fe(e))})}
    </script></body></html>
